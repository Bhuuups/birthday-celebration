<!DOCTYPE html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Birthday Celebration</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Hind:wght@400;500;600&display=swap"><link rel="stylesheet" href="style.css"></head>
<body><main>
<h1 id="h">Birthday celebration 🎉</h1><p class="sub">Apni pasand ke options chuno, budget dekho, phir request bhejo. Hum aapko WhatsApp par sampark karenge.</p>
<section><div class="row"><div class="grow"><label for="g">Kitne mehmaan (bachche + bade)</label><input id="g" type="number" min="1" value="20"></div>
<div class="grow"><label for="b">Aapka budget (₹)</label><input id="b" type="number" min="0" placeholder="10000"></div></div></section>
<div id="cats"></div>
<section id="fm"><h2>Aapki details</h2>
<label for="pn">Aapka naam</label><input id="pn"><label for="ph">WhatsApp number</label><input id="ph" type="tel" inputmode="numeric">
<label for="dt">Party ki tareekh</label><input id="dt" type="date"><label for="nt">Koi aur zaroorat</label><textarea id="nt" rows="3"></textarea>
<div id="er" class="over"></div><p><button id="go">Request bhejo</button></p></section>
<div id="done" class="msg" hidden>🎉 Request mil gayi! Hum jaldi hi WhatsApp par sampark karenge. Dhanyavaad.</div>
</main>
<div class="bar"><div><b id="tot">₹0</b> <span id="m"></span></div><a href="#fm"><button>Aage badho</button></a></div>
<script>
var C=[],sel={},P=new URLSearchParams(location.search);
function $(i){return document.getElementById(i)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function fmt(n){return "₹"+Math.round(n).toLocaleString("en-IN")}
function total(){var g=+$("g").value||0,t=0;C.forEach(function(i){if(sel[i.id])t+=i.unit==="guest"?i.price*g:i.price});return t}
function upd(){var t=total(),b=+$("b").value||0,m=$("m");$("tot").textContent=fmt(t);
if(!b){m.textContent="";return}
if(t<=b){m.textContent=fmt(b-t)+" budget bacha hai";m.className="ok"}else{m.textContent=fmt(t-b)+" budget se zyada";m.className="over"}}
if(P.get("s"))$("h").textContent=P.get("s")+" ka birthday 🎉";
fetch("/api/items").then(function(r){return r.json()}).then(function(d){C=d;var cats={};
d.forEach(function(i){(cats[i.cat]=cats[i.cat]||[]).push(i)});
$("cats").innerHTML=Object.keys(cats).length?Object.keys(cats).map(function(c){return "<h2>"+esc(c)+"</h2><div class='grid'>"+cats[c].map(function(i){
return "<div class='it' data-id='"+i.id+"'>"+(i.img?"<img loading='lazy' alt='"+esc(i.name)+"' src='"+esc(i.img)+"'>":"")+"<div class='b'><b>"+esc(i.name)+"</b><span class='price'>"+fmt(i.price)+(i.unit==="guest"?" / mehmaan":"")+"</span><span class='meta'>"+esc(i.desc)+"</span><button class='alt'>Chuno</button></div></div>"}).join("")+"</div>"}).join(""):"<p class='meta'>Abhi koi option nahi hai.</p>";upd()});
$("cats").onclick=function(e){var b=e.target.closest("button");if(!b)return;var c=b.closest(".it"),id=c.dataset.id;
sel[id]=!sel[id];c.classList.toggle("on",sel[id]);b.textContent=sel[id]?"Chuna ✓":"Chuno";upd()};
$("g").oninput=upd;$("b").oninput=upd;
$("go").onclick=function(){$("er").textContent="";
fetch("/api/requests",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({student:P.get("s")||"",parent:$("pn").value,phone:$("ph").value,date:$("dt").value,guests:+$("g").value,budget:+$("b").value,notes:$("nt").value,itemIds:Object.keys(sel).filter(function(k){return sel[k]})})})
.then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error);return j})}).then(function(){$("fm").hidden=true;$("done").hidden=false;scrollTo(0,0)}).catch(function(e){$("er").textContent=e.message||"Kuch gadbad hui, dobara try karo"})};
</script></body></html>
